workflows:
  ios-workflow:
    name: iOS - Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.alek6dev.chessclock"
    scripts:
      - name: Générer le projet Xcode avec XcodeGen
        script: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build de validation (simulateur, sans signature)
        script: |
          cd ios
          xcodebuild -project ChessClock.xcodeproj -scheme ChessClock \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

  ios-testflight:
    name: iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Alek6dev
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.alek6dev.chessclock"
        XCODE_SCHEME: "ChessClock"
        APP_STORE_CONNECT_APP_ID: "6814388062"
      xcode: latest
    scripts:
      - name: Calculer le build number et l'écrire dans project.yml
        script: |
          cd ios
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_CONNECT_APP_ID" --all-versions)
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Dernier build number connu par Apple : $LATEST_BUILD_NUMBER"
          echo "Build number utilisé pour ce build : $NEXT_BUILD_NUMBER"
          sed -i '' "s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"$NEXT_BUILD_NUMBER\"/" project.yml
          grep CURRENT_PROJECT_VERSION project.yml
      - name: Générer le projet Xcode avec XcodeGen
        script: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Initialiser le keychain de signature
        script: keychain initialize
      - name: Récupérer le certificat et le profil de provisioning App Store
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Importer le certificat dans le keychain
        script: keychain add-certificates
      - name: Appliquer les profils de provisioning récupérés
        script: |
          xcode-project use-profiles \
            --custom-export-options '{"manageAppVersionAndBuildNumber": false}'
          echo "Contenu de export_options.plist généré :"
          cat "$HOME/export_options.plist"
      - name: Builder l'ipa signé pour distribution App Store
        script: |
          cd ios
          echo "Contenu de build/ios/ipa avant build :"
          ls -la build/ios/ipa 2>/dev/null || echo "(dossier absent, rien à nettoyer)"
          rm -rf build
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          xcode-project build-ipa \
            --project ChessClock.xcodeproj \
            --scheme "$XCODE_SCHEME" \
            --clean \
            --disable-xcpretty \
            --verbose
          echo "Contenu de build/ios/ipa après build :"
          ls -la build/ios/ipa
          rm -rf /tmp/ipa_check
          unzip -o -q build/ios/ipa/*.ipa -d /tmp/ipa_check
          echo "CFBundleVersion réellement présent dans l'ipa exporté :"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" /tmp/ipa_check/Payload/*.app/Info.plist
    artifacts:
      - ios/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
