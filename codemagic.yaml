workflows:
  android-workflow:
    name: Android - Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      vars:
        PACKAGE_NAME: "com.alek6dev.chessclock"
    scripts:
      - name: Générer le wrapper Gradle
        script: |
          # Génération dans un dossier vide : le Gradle système installé sur
          # l'agent est trop ancien pour évaluer notre build.gradle.kts (AGP
          # exige Gradle ≥ 8.7), donc on ne le laisse pas configurer notre
          # projet. On copie ensuite le wrapper généré dans android/.
          mkdir -p /tmp/gradle-wrapper-gen
          cd /tmp/gradle-wrapper-gen
          gradle wrapper --gradle-version 8.9
          cp -r gradle "$CM_BUILD_DIR/android/"
          cp gradlew gradlew.bat "$CM_BUILD_DIR/android/"
          chmod +x "$CM_BUILD_DIR/android/gradlew"
      - name: Build APK debug
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

  ios-workflow:
    name: iOS - Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.alek6dev.chessclock"
    scripts:
      - name: Générer le projet Xcode avec XcodeGen
        script: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build de validation (simulateur, sans signature)
        script: |
          cd ios
          xcodebuild -project ChessClock.xcodeproj -scheme ChessClock \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
