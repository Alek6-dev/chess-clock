workflows:
  ios-workflow:
    name: iOS - Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.alek6dev.chessclock"
    scripts:
      - name: Générer le projet Xcode avec XcodeGen
        script: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build de validation (simulateur, sans signature)
        script: |
          cd ios
          xcodebuild -project ChessClock.xcodeproj -scheme ChessClock \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

  ios-testflight:
    name: iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Alek6dev
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.alek6dev.chessclock"
        XCODE_SCHEME: "ChessClock"
        APP_STORE_CONNECT_APP_ID: "6814388062"
      xcode: latest
    scripts:
      - name: Calculer le build number et l'écrire dans project.yml
        script: |
          cd ios
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_CONNECT_APP_ID" --all-versions)
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Dernier build number connu par Apple : $LATEST_BUILD_NUMBER"
          echo "Build number utilisé pour ce build : $NEXT_BUILD_NUMBER"
          sed -i '' "s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"$NEXT_BUILD_NUMBER\"/" project.yml
          grep CURRENT_PROJECT_VERSION project.yml
      - name: Générer le projet Xcode avec XcodeGen
        script: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Initialiser le keychain de signature
        script: keychain initialize
      - name: Récupérer le certificat et le profil de provisioning App Store
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Importer le certificat dans le keychain
        script: keychain add-certificates
      - name: Appliquer les profils de provisioning récupérés
        script: |
          xcode-project use-profiles \
            --custom-export-options '{"manageAppVersionAndBuildNumber": false, "testFlightInternalTestingOnly": true}'
          echo "Contenu de export_options.plist généré :"
          cat "$HOME/export_options.plist"
      - name: Builder l'ipa signé pour distribution App Store
        script: |
          cd ios
          echo "=== Diagnostic : réglages resolus en configuration Release (celle de l'archive) ==="
          xcodebuild -project ChessClock.xcodeproj -scheme "$XCODE_SCHEME" -configuration Release -showBuildSettings 2>/dev/null \
            | grep -E "CURRENT_PROJECT_VERSION|MARKETING_VERSION|GENERATE_INFOPLIST_FILE|INFOPLIST_FILE |CONFIGURATION ="
          echo "=== Fin diagnostic ==="
          echo "Contenu de build/ios/ipa avant build :"
          ls -la build/ios/ipa 2>/dev/null || echo "(dossier absent, rien à nettoyer)"
          rm -rf build
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          xcode-project build-ipa \
            --project ChessClock.xcodeproj \
            --scheme "$XCODE_SCHEME" \
            --clean \
            --disable-xcpretty \
            --verbose
          echo "Contenu de build/ios/ipa après build :"
          ls -la build/ios/ipa

          IPA_PATH=$(ls build/ios/ipa/*.ipa)
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_CONNECT_APP_ID" --all-versions)
          FORCED_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Build number forcé dans l'ipa final : $FORCED_BUILD_NUMBER"

          rm -rf /tmp/ipa_patch
          WORKDIR=/tmp/ipa_patch
          mkdir -p "$WORKDIR"
          unzip -o -q "$IPA_PATH" -d "$WORKDIR"
          APP_PATH=$(ls -d "$WORKDIR"/Payload/*.app)

          echo "Fichiers de police présents dans le bundle :"
          ls "$APP_PATH"/*.ttf 2>/dev/null || echo "(aucun .ttf trouvé dans le bundle)"

          ENTITLEMENTS_PATH="$WORKDIR/entitlements.plist"
          codesign -d --entitlements :- "$APP_PATH" > "$ENTITLEMENTS_PATH"

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $FORCED_BUILD_NUMBER" "$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy -c "Delete :UILaunchScreen" "$APP_PATH/Info.plist" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy -c "Delete :UIAppFonts" "$APP_PATH/Info.plist" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UIAppFonts array" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIAppFonts:0 string InstrumentSerif-Regular.ttf" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIAppFonts:1 string EBGaramond-Regular.ttf" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIAppFonts:2 string EBGaramond-Medium.ttf" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIAppFonts:3 string EBGaramond-SemiBold.ttf" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIAppFonts:4 string EBGaramond-Italic.ttf" "$APP_PATH/Info.plist"

          IDENTITY=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -1 | awk '{print $2}')
          echo "Identité de signature utilisée pour re-signer : $IDENTITY"
          codesign --force --sign "$IDENTITY" --entitlements "$ENTITLEMENTS_PATH" --generate-entitlement-der "$APP_PATH"

          rm -f "$IPA_PATH"
          (cd "$WORKDIR" && zip -qry - Payload) > "$IPA_PATH"

          echo "Vérification finale de l'ipa patché :"
          rm -rf /tmp/ipa_verify
          unzip -o -q "$IPA_PATH" -d /tmp/ipa_verify
          VERIFY_APP=$(ls -d /tmp/ipa_verify/Payload/*.app)
          echo "CFBundleVersion : $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$VERIFY_APP/Info.plist")"
          echo "UILaunchScreen : $(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$VERIFY_APP/Info.plist")"
          echo "UIAppFonts : $(/usr/libexec/PlistBuddy -c 'Print :UIAppFonts' "$VERIFY_APP/Info.plist")"
    artifacts:
      - ios/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
